<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Messages P2P (No Backend)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .toast-enter {
            animation: slideIn 0.3s ease-out forwards;
        }
        .toast-exit {
            animation: slideOut 0.3s ease-in forwards;
        }
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(100%); opacity: 0; }
        }
    </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 h-screen w-full flex overflow-hidden transition-colors duration-200">

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- App Container -->
    <div class="flex h-screen w-full">
        
        <!-- Sidebar -->
        <div id="sidebar" class="w-full md:w-[360px] lg:w-[400px] border-r border-gray-200 dark:border-gray-800 flex flex-col bg-white dark:bg-gray-900 transition-all duration-300 z-20">
            
            <!-- Sidebar Header -->
            <div class="p-4 flex flex-col gap-4 border-b border-gray-100 dark:border-gray-800">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <button id="theme-toggle" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full text-gray-600 dark:text-gray-300 transition-colors">
                            <!-- Moon icon (shows in light mode) -->
                            <svg id="icon-moon" class="hidden w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                            <!-- Sun icon (shows in dark mode) -->
                            <svg id="icon-sun" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        </button>
                        <h1 class="text-xl text-gray-700 dark:text-gray-200 font-normal tracking-wide">P2P Messages</h1>
                    </div>
                    <div id="connection-status" class="flex items-center gap-2 text-xs font-medium">
                        <span class="flex items-center gap-1 text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded-full">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M8.53 8.53a9 9 0 0 1 11.23 3.65"/><path d="M12.36 12.36a3 3 0 0 1 3.52 3.52"/><path d="M5 5a15 15 0 0 1-2 2 15 15 0 0 1 18-2"/><path d="M16 16a15 15 0 0 1-14-1"/></svg>
                            Initializing...
                        </span>
                    </div>
                </div>
                
                <!-- Profile Section -->
                <div class="bg-[#f0f4f9] dark:bg-gray-800 rounded-2xl p-3 flex flex-col gap-3">
                    <!-- Name Input -->
                    <div>
                        <span class="text-xs text-gray-500 dark:text-gray-400 font-medium uppercase tracking-wider ml-1">Display Name</span>
                        <input id="my-name-input" type="text" placeholder="Set your name" class="mt-1 w-full bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl px-3 py-2 text-sm text-gray-700 dark:text-gray-200 focus:outline-none focus:border-blue-500 dark:focus:border-blue-400 transition-colors"/>
                    </div>
                    <!-- ID Input -->
                    <div>
                        <span class="text-xs text-gray-500 dark:text-gray-400 font-medium uppercase tracking-wider ml-1">Your Peer ID (Share to chat)</span>
                        <div class="flex items-center gap-2 mt-1">
                            <input id="my-id-input" type="text" readonly value="Loading..." class="flex-1 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl px-3 py-2 text-sm text-gray-700 dark:text-gray-200 focus:outline-none"/>
                            <button id="copy-btn" class="p-2 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 transition-colors" title="Copy ID">
                                <svg id="icon-copy" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                                <svg id="icon-check" class="hidden text-green-600 dark:text-green-400" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Connect Section -->
                <form id="connect-form" class="relative mt-2">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500 dark:text-gray-400"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
                    </div>
                    <input id="connect-input" type="text" placeholder="Paste friend's ID to connect" class="w-full pl-10 pr-20 py-3 bg-[#f0f4f9] dark:bg-gray-800 dark:text-gray-100 border-none rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-100 dark:focus:ring-blue-900 transition-shadow"/>
                    <button type="submit" id="connect-btn" disabled class="absolute right-1 top-1 bottom-1 px-4 bg-[#0b57d0] text-white text-sm font-medium rounded-full hover:bg-blue-700 disabled:opacity-50 transition-colors">
                        Connect
                    </button>
                </form>
            </div>

            <!-- Conversations List -->
            <div id="contacts-list" class="flex-1 overflow-y-auto pb-4">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Main Chat Area -->
        <div id="chat-area" class="flex-1 hidden md:flex flex-col relative bg-white dark:bg-gray-900">
            
            <!-- Default Empty State -->
            <div id="empty-chat-state" class="flex-1 flex items-center justify-center bg-[#f8fafd] dark:bg-gray-950 flex-col text-center p-8 transition-colors">
                <div class="w-48 h-48 mb-6 text-gray-200 dark:text-gray-700 opacity-50 relative">
                    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="100" r="30" fill="currentColor" />
                        <circle cx="150" cy="100" r="30" fill="currentColor" />
                        <path d="M80 100 L120 100" stroke="currentColor" stroke-width="8" stroke-dasharray="10 10" />
                    </svg>
                </div>
                <h2 class="text-2xl font-medium text-gray-700 dark:text-gray-300 mb-2">Secure P2P Messaging</h2>
                <p class="text-gray-500 dark:text-gray-400 max-w-md">
                    Messages are sent directly peer-to-peer and saved locally on your device.
                </p>
            </div>

            <!-- Active Chat Interface -->
            <div id="active-chat-interface" class="flex-1 flex-col hidden h-full">
                <!-- Chat Header -->
                <div class="h-16 border-b border-gray-200 dark:border-gray-800 px-4 flex items-center justify-between bg-white/90 dark:bg-gray-900/90 backdrop-blur-sm shadow-sm z-10 flex-shrink-0">
                    <div class="flex items-center gap-3">
                        <button id="back-btn" class="md:hidden p-2 -ml-2 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition-colors">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" x2="5" y1="12" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                        </button>
                        <div class="relative">
                            <img id="chat-header-avatar" src="" alt="Avatar" class="w-10 h-10 rounded-full object-cover bg-gray-100 dark:bg-gray-800" />
                            <div id="chat-header-status-dot" class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-white dark:border-gray-900 bg-gray-400"></div>
                        </div>
                        <div>
                            <h2 id="chat-header-name" class="text-lg font-medium text-gray-800 dark:text-gray-200 leading-tight">Name</h2>
                            <p id="chat-header-status-text" class="text-xs text-gray-500 dark:text-gray-400">Offline</p>
                        </div>
                    </div>
                </div>

                <!-- Messages List -->
                <div id="messages-list" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 bg-[#f8fafd] dark:bg-gray-950 transition-colors">
                    <!-- Populated by JS -->
                </div>

                <!-- Connection Banner -->
                <div id="reconnect-banner" class="hidden bg-yellow-50 dark:bg-yellow-900/30 border-t border-yellow-200 dark:border-yellow-800 p-2 text-center text-xs text-yellow-700 dark:text-yellow-400 flex items-center justify-center gap-2">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    Peer is disconnected. Messages will not be sent until they reconnect.
                    <button id="reconnect-btn" class="ml-2 font-bold underline hover:text-yellow-900 dark:hover:text-yellow-200">Try Reconnecting</button>
                </div>

                <!-- Input Area -->
                <div class="p-3 bg-white dark:bg-gray-900 flex-shrink-0 z-20 transition-colors">
                    <form id="message-form" class="flex items-end gap-2 bg-[#f0f4f9] dark:bg-gray-800 rounded-[24px] p-1 pr-2">
                        <div class="flex items-center gap-1 p-1 mb-1">
                            <button type="button" class="p-2 text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-full transition-colors hidden sm:block">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="16"/><line x1="8" x2="16" y1="12" y2="12"/></svg>
                            </button>
                        </div>
                        
                        <textarea id="message-input" placeholder="Text message" class="flex-1 max-h-32 min-h-[44px] bg-transparent border-none focus:outline-none resize-none py-3 px-2 text-[15px] text-gray-800 dark:text-gray-100 self-center disabled:opacity-50" rows="1"></textarea>
                        
                        <div class="mb-1">
                            <button type="submit" id="send-btn" disabled class="p-2.5 bg-[#0b57d0] text-white rounded-full hover:bg-blue-700 disabled:bg-gray-300 disabled:dark:bg-gray-700 disabled:text-gray-500 dark:disabled:text-gray-500 transition-colors flex items-center justify-center shadow-sm">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 14C13.66 14 15 12.66 15 11V5C15 3.34 13.66 2 12 2C10.34 2 9 3.34 9 5V11C9 12.66 10.34 14 12 14ZM11 5C11 4.45 11.45 4 12 4C12.55 4 13 4.45 13 5V11C13 11.55 12.55 12 12 12C11.45 12 11 11.55 11 11V5ZM17 11C17 13.76 14.76 16 12 16C9.24 16 7 13.76 7 11H5C5 14.53 7.61 17.43 11 17.92V21H13V17.92C16.39 17.43 19 14.53 19 11H17Z" fill="currentColor"/>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State ---
        let myId = '';
        let myName = '';
        let isDarkMode = false;
        let peerInstance = null;
        let activeChatId = null;
        let contacts = []; 
        let messages = {}; 
        let activeConnections = {}; 

        // --- DOM Elements ---
        const connectionStatusEl = document.getElementById('connection-status');
        const myIdInput = document.getElementById('my-id-input');
        const myNameInput = document.getElementById('my-name-input');
        const copyBtn = document.getElementById('copy-btn');
        const connectForm = document.getElementById('connect-form');
        const connectInput = document.getElementById('connect-input');
        const connectBtn = document.getElementById('connect-btn');
        const contactsList = document.getElementById('contacts-list');
        const themeToggle = document.getElementById('theme-toggle');
        const iconSun = document.getElementById('icon-sun');
        const iconMoon = document.getElementById('icon-moon');
        
        const sidebar = document.getElementById('sidebar');
        const chatArea = document.getElementById('chat-area');
        
        const emptyChatState = document.getElementById('empty-chat-state');
        const activeChatInterface = document.getElementById('active-chat-interface');
        const backBtn = document.getElementById('back-btn');
        const chatHeaderAvatar = document.getElementById('chat-header-avatar');
        const chatHeaderStatusDot = document.getElementById('chat-header-status-dot');
        const chatHeaderName = document.getElementById('chat-header-name');
        const chatHeaderStatusText = document.getElementById('chat-header-status-text');
        
        const messagesList = document.getElementById('messages-list');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const reconnectBanner = document.getElementById('reconnect-banner');
        const reconnectBtn = document.getElementById('reconnect-btn');

        // --- IndexedDB Wrapper ---
        const DB_NAME = 'P2PMessagesDB';
        const DB_VERSION = 1;
        let db;

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (e) => reject("Error opening DB");
                request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
                    if (!db.objectStoreNames.contains('contacts')) db.createObjectStore('contacts', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('messages')) {
                        const msgStore = db.createObjectStore('messages', { keyPath: 'id' });
                        msgStore.createIndex('threadId', 'threadId', { unique: false });
                    }
                };
            });
        };

        const dbPut = (storeName, data) => new Promise((resolve, reject) => {
            const tx = db.transaction(storeName, 'readwrite');
            const req = tx.objectStore(storeName).put(data);
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error);
        });

        const dbGet = (storeName, key) => new Promise((resolve, reject) => {
            const tx = db.transaction(storeName, 'readonly');
            const req = tx.objectStore(storeName).get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });

        const dbGetAll = (storeName) => new Promise((resolve, reject) => {
            const tx = db.transaction(storeName, 'readonly');
            const req = tx.objectStore(storeName).getAll();
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });

        const dbGetMessagesByThread = (threadId) => new Promise((resolve, reject) => {
            const tx = db.transaction('messages', 'readonly');
            const index = tx.objectStore('messages').index('threadId');
            const req = index.getAll(IDBKeyRange.only(threadId));
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });

        // --- Utilities ---
        const generateRandomId = () => Math.random().toString(36).substring(2, 10);

        const showToast = (message, type = 'info') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-enter px-4 py-2 rounded-full shadow-lg text-sm font-medium flex items-center gap-2 pointer-events-auto ${
                type === 'error' ? 'bg-red-600 text-white' : type === 'success' ? 'bg-green-600 text-white' : 'bg-gray-800 dark:bg-gray-700 text-white'
            }`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        const updateMobileView = () => {
            if (window.innerWidth < 768) {
                if (activeChatId) {
                    sidebar.classList.add('hidden'); sidebar.classList.remove('flex');
                    chatArea.classList.add('flex'); chatArea.classList.remove('hidden');
                } else {
                    sidebar.classList.remove('hidden'); sidebar.classList.add('flex');
                    chatArea.classList.remove('flex'); chatArea.classList.add('hidden');
                }
            } else {
                sidebar.classList.remove('hidden'); sidebar.classList.add('flex');
                chatArea.classList.remove('hidden'); chatArea.classList.add('flex');
            }
        };

        // --- Notifications ---
        const requestNotificationPermission = () => {
            if (Notification.permission === 'default') Notification.requestPermission();
        };
        document.body.addEventListener('click', requestNotificationPermission, { once: true });

        const triggerNotification = (senderName, text) => {
            if (Notification.permission === 'granted' && document.hidden) {
                new Notification(`Message from ${senderName}`, { body: text });
            }
        };

        // --- Theme Logic ---
        const applyTheme = (dark) => {
            isDarkMode = dark;
            if (dark) {
                document.documentElement.classList.add('dark');
                iconSun.classList.add('hidden');
                iconMoon.classList.remove('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                iconMoon.classList.add('hidden');
                iconSun.classList.remove('hidden');
            }
        };

        themeToggle.addEventListener('click', async () => {
            applyTheme(!isDarkMode);
            await dbPut('settings', { key: 'darkMode', value: isDarkMode });
        });

        // --- Data Loading & Rendering ---
        const loadInitialData = async () => {
            // Load Theme
            let themeSetting = await dbGet('settings', 'darkMode');
            if (themeSetting !== undefined) applyTheme(themeSetting.value);
            else applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);

            // Load Name
            let savedName = await dbGet('settings', 'myName');
            if (savedName && savedName.value) {
                myName = savedName.value;
                myNameInput.value = myName;
            }

            // Load strict one-per-device ID
            let savedId = await dbGet('settings', 'myId');
            if (savedId && savedId.value) {
                myId = savedId.value;
            } else {
                myId = `peer_${generateRandomId()}`;
                await dbPut('settings', { key: 'myId', value: myId });
            }
            myIdInput.value = myId;

            // Load Contacts & Messages
            const loadedContacts = await dbGetAll('contacts');
            contacts = loadedContacts.sort((a, b) => b.timestamp - a.timestamp);
            for (const contact of contacts) {
                const threadMsgs = await dbGetMessagesByThread(contact.id);
                messages[contact.id] = threadMsgs.sort((a, b) => a.timestamp - b.timestamp);
            }

            renderContacts();
            initPeerJS();
        };

        myNameInput.addEventListener('change', async (e) => {
            myName = e.target.value.trim();
            await dbPut('settings', { key: 'myName', value: myName });
            showToast('Display name saved', 'success');
        });

        const renderContacts = () => {
            if (contacts.length === 0) {
                contactsList.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-gray-400 dark:text-gray-600 p-8 text-center gap-3">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
                        <p class="text-sm">No connections yet. Share your ID to start chatting securely.</p>
                    </div>
                `;
                return;
            }

            contactsList.innerHTML = '';
            contacts.forEach(conv => {
                const isActive = activeChatId === conv.id;
                const isOnline = !!activeConnections[conv.id];
                
                const contactDiv = document.createElement('div');
                contactDiv.className = `flex items-center gap-4 p-3 mx-2 my-1 rounded-2xl cursor-pointer transition-colors ${
                    isActive ? 'bg-[#c2e7ff] dark:bg-blue-900/40' : 'hover:bg-gray-100 dark:hover:bg-gray-800'
                }`;
                contactDiv.onclick = () => selectContact(conv.id);

                contactDiv.innerHTML = `
                    <div class="relative flex-shrink-0">
                        <img src="${conv.avatar}" alt="${conv.name}" class="w-12 h-12 rounded-full object-cover bg-gray-100 dark:bg-gray-700 ${!isOnline ? 'opacity-50 grayscale' : ''}" />
                        ${conv.unread > 0 ? `<div class="absolute -top-1 -right-1 bg-[#0b57d0] text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white dark:border-gray-900">${conv.unread}</div>` : ''}
                        <div class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white dark:border-gray-900 ${isOnline ? 'bg-green-500' : 'bg-gray-400'}"></div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-baseline mb-0.5">
                            <h3 class="text-[15px] truncate ${conv.unread > 0 ? 'font-bold text-gray-900 dark:text-gray-100' : 'font-medium text-gray-800 dark:text-gray-300'}">${conv.name}</h3>
                            <span class="text-xs flex-shrink-0 ml-2 ${conv.unread > 0 ? 'font-bold text-blue-600 dark:text-blue-400' : 'text-gray-500 dark:text-gray-500'}">
                                ${conv.timestamp ? new Date(conv.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ''}
                            </span>
                        </div>
                        <p class="text-[14px] truncate ${conv.unread > 0 ? 'font-bold text-gray-800 dark:text-gray-200' : 'text-gray-500 dark:text-gray-500'}">${conv.lastMessage || 'Connected'}</p>
                    </div>
                `;
                contactsList.appendChild(contactDiv);
            });
        };

        const renderChatHeader = () => {
            const activeContact = contacts.find(c => c.id === activeChatId);
            if (!activeContact) return;

            const isOnline = !!activeConnections[activeContact.id];
            chatHeaderAvatar.src = activeContact.avatar;
            chatHeaderName.textContent = activeContact.name;
            chatHeaderStatusText.textContent = isOnline ? 'Online (P2P)' : 'Offline (Disconnected)';
            chatHeaderStatusDot.className = `absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-white dark:border-gray-900 ${isOnline ? 'bg-green-500' : 'bg-gray-400'}`;
            
            messageInput.disabled = !isOnline;
            messageInput.placeholder = isOnline ? 'Text message' : 'Waiting for peer to connect...';
            
            isOnline ? reconnectBanner.classList.add('hidden') : reconnectBanner.classList.remove('hidden');
            updateSendButtonState();
        };

        const renderMessages = () => {
            const currentMessages = messages[activeChatId] || [];
            if (currentMessages.length === 0) {
                messagesList.innerHTML = `
                    <div class="m-auto text-center p-6 max-w-sm">
                        <div class="bg-blue-50 dark:bg-blue-900/20 text-blue-800 dark:text-blue-300 rounded-2xl p-4 text-sm inline-block shadow-sm border border-blue-100 dark:border-blue-900/50">
                            Say hi! Messages are saved securely on your device.
                        </div>
                    </div>
                `;
                return;
            }

            messagesList.innerHTML = '';
            const activeContact = contacts.find(c => c.id === activeChatId);

            currentMessages.forEach((msg, index) => {
                const isMe = msg.senderId === myId;
                const showAvatar = !isMe && (index === currentMessages.length - 1 || currentMessages[index + 1]?.senderId === myId);
                const timeString = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                const msgDiv = document.createElement('div');
                msgDiv.className = `flex w-full ${isMe ? 'justify-end' : 'justify-start'}`;
                
                msgDiv.innerHTML = `
                    <div class="flex max-w-[85%] md:max-w-[70%] items-end gap-2">
                        ${!isMe ? `
                            <div class="w-8 h-8 flex-shrink-0">
                                ${showAvatar ? `<img src="${activeContact.avatar}" class="w-8 h-8 rounded-full object-cover bg-gray-200 dark:bg-gray-700" />` : '<div class="w-8 h-8"></div>'}
                            </div>
                        ` : ''}
                        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                            <div class="px-4 py-2.5 text-[15px] shadow-sm ${
                                isMe 
                                    ? 'bg-[#0b57d0] text-white rounded-l-2xl rounded-tr-2xl rounded-br-sm' 
                                    : 'bg-[#f0f4f9] dark:bg-gray-800 text-gray-800 dark:text-gray-100 border border-gray-100 dark:border-gray-700 rounded-r-2xl rounded-tl-2xl rounded-bl-sm'
                            }" style="word-break: break-word;">
                                ${msg.text}
                            </div>
                            <span class="text-[11px] text-gray-400 dark:text-gray-500 mt-1 mx-1">${timeString}</span>
                        </div>
                    </div>
                `;
                messagesList.appendChild(msgDiv);
            });
            messagesList.scrollTop = messagesList.scrollHeight;
        };

        const selectContact = async (id) => {
            activeChatId = id;
            const contact = contacts.find(c => c.id === id);
            if (contact && contact.unread > 0) {
                contact.unread = 0;
                await dbPut('contacts', contact);
            }
            emptyChatState.classList.add('hidden');
            activeChatInterface.classList.remove('hidden');
            activeChatInterface.classList.add('flex');
            
            renderContacts();
            renderChatHeader();
            renderMessages();
            updateMobileView();
            setTimeout(() => messageInput.focus(), 100);
        };

        const updateSendButtonState = () => {
            const isOnline = !!activeConnections[activeChatId];
            sendBtn.disabled = !isOnline || messageInput.value.trim().length === 0;
        };

        // --- PeerJS Logic ---
        const initPeerJS = () => {
            peerInstance = new Peer(myId, {
                config: {'iceServers': [
                    { url: 'stun:stun.l.google.com:19302' },
                    { url: 'stun:stun1.l.google.com:19302' }
                ]}
            });

            peerInstance.on('open', (id) => {
                connectionStatusEl.innerHTML = `
                    <span class="flex items-center gap-1 text-green-700 dark:text-green-400 bg-green-50 dark:bg-green-900/30 px-2 py-1 rounded-full">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" x2="12.01" y1="20" y2="20"/></svg>
                        Ready
                    </span>
                `;
            });

            peerInstance.on('connection', (conn) => {
                setupConnectionListeners(conn);
            });

            peerInstance.on('error', (err) => {
                console.error("PeerJS Error:", err);
                if (err.type === 'unavailable-id') {
                    // Force single ID logic: If ID is in use, do NOT generate a new one. 
                    // Tell user to close other tabs, and retry.
                    connectionStatusEl.innerHTML = `<span class="text-red-500 text-xs">Session active elsewhere. Retrying...</span>`;
                    showToast("ID in use by another tab. Please close it.", "error");
                    
                    if (peerInstance) peerInstance.destroy();
                    setTimeout(initPeerJS, 5000); // Retry after 5s
                } else {
                    showToast(`Network Error: ${err.type}`, "error");
                }
            });
        };

        const connectToPeer = (peerId) => {
            if (!peerInstance || peerId === myId) return;
            showToast(`Connecting to ${peerId}...`);
            
            // Pass myName in metadata during handshake
            const conn = peerInstance.connect(peerId, { reliable: true, metadata: { senderName: myName } });
            setupConnectionListeners(conn);
        };

        const setupConnectionListeners = (conn) => {
            conn.on('open', async () => {
                activeConnections[conn.peer] = conn;
                
                // Get the remote name from metadata, fallback to peer ID
                const remoteName = conn.metadata?.senderName || `Peer ${conn.peer.substring(0, 5)}`;
                
                let contact = contacts.find(c => c.id === conn.peer);
                if (!contact) {
                    contact = {
                        id: conn.peer,
                        name: remoteName,
                        avatar: `https://api.dicebear.com/7.x/identicon/svg?seed=${conn.peer}`,
                        lastMessage: 'Connected via P2P',
                        timestamp: Date.now(),
                        unread: 0
                    };
                    contacts.unshift(contact);
                    messages[conn.peer] = [];
                } else if (conn.metadata?.senderName && contact.name !== conn.metadata.senderName) {
                    // Update name if they changed it
                    contact.name = conn.metadata.senderName;
                }
                
                await dbPut('contacts', contact);
                showToast(`Connected to ${contact.name}`, 'success');
                renderContacts();
                if (activeChatId === conn.peer) renderChatHeader();
            });

            conn.on('data', async (data) => {
                if (data.type === 'chat') {
                    const msg = {
                        id: crypto.randomUUID(),
                        threadId: conn.peer,
                        text: data.text,
                        senderId: conn.peer,
                        timestamp: data.timestamp
                    };

                    await dbPut('messages', msg);
                    if (!messages[conn.peer]) messages[conn.peer] = [];
                    messages[conn.peer].push(msg);

                    let contact = contacts.find(c => c.id === conn.peer);
                    if (contact) {
                        contact.lastMessage = msg.text;
                        contact.timestamp = msg.timestamp;
                        // Update name dynamically if sent in chat payload
                        if (data.senderName) contact.name = data.senderName; 
                        
                        if (activeChatId !== conn.peer) {
                            contact.unread = (contact.unread || 0) + 1;
                            triggerNotification(contact.name, msg.text);
                        }
                        await dbPut('contacts', contact);
                        contacts.sort((a, b) => b.timestamp - a.timestamp);
                    }

                    renderContacts();
                    if (activeChatId === conn.peer) renderMessages();
                }
            });

            conn.on('close', () => {
                delete activeConnections[conn.peer];
                renderContacts();
                if (activeChatId === conn.peer) renderChatHeader();
            });

            conn.on('error', (err) => {
                delete activeConnections[conn.peer];
                renderContacts();
                if (activeChatId === conn.peer) renderChatHeader();
            });
        };

        // --- Event Listeners ---
        copyBtn.addEventListener('click', () => {
            if (!myId) return;
            navigator.clipboard.writeText(myId).then(() => {
                document.getElementById('icon-copy').classList.add('hidden');
                document.getElementById('icon-check').classList.remove('hidden');
                showToast('ID copied to clipboard', 'success');
                setTimeout(() => {
                    document.getElementById('icon-copy').classList.remove('hidden');
                    document.getElementById('icon-check').classList.add('hidden');
                }, 2000);
            }).catch(() => {
                myIdInput.select();
                document.execCommand('copy');
                showToast('ID copied (fallback)', 'success');
            });
        });

        connectInput.addEventListener('input', (e) => {
            connectBtn.disabled = e.target.value.trim().length === 0;
        });

        connectForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const connectToId = connectInput.value.trim();
            if (!connectToId || connectToId === myId) return;
            connectToPeer(connectToId);
            connectInput.value = '';
            connectBtn.disabled = true;
        });

        messageInput.addEventListener('input', updateSendButtonState);
        
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                messageForm.dispatchEvent(new Event('submit'));
            }
        });

        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !activeChatId || !myId) return;

            const conn = activeConnections[activeChatId];
            if (!conn) return showToast("Cannot send. Peer disconnected.", "error");

            const timestamp = Date.now();
            const msgData = {
                id: crypto.randomUUID(),
                threadId: activeChatId,
                text: text,
                senderId: myId,
                timestamp: timestamp
            };

            try {
                // Include senderName in payload to update dynamic name changes mid-chat
                conn.send({ type: 'chat', text: text, timestamp: timestamp, senderName: myName });

                await dbPut('messages', msgData);
                if (!messages[activeChatId]) messages[activeChatId] = [];
                messages[activeChatId].push(msgData);

                const myContact = contacts.find(c => c.id === activeChatId);
                if (myContact) {
                    myContact.lastMessage = text;
                    myContact.timestamp = timestamp;
                    await dbPut('contacts', myContact);
                    contacts.sort((a, b) => b.timestamp - a.timestamp);
                }

                messageInput.value = '';
                updateSendButtonState();
                
                renderContacts();
                renderMessages();
            } catch (err) {
                showToast("Failed to send message", "error");
            }
        });

        backBtn.addEventListener('click', () => {
            activeChatId = null;
            updateMobileView();
        });

        reconnectBtn.addEventListener('click', () => {
            if (activeChatId) connectToPeer(activeChatId);
        });

        window.addEventListener('resize', updateMobileView);
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await initDB();
                await loadInitialData();
                updateMobileView();
            } catch (error) {
                showToast("Failed to load database.", "error");
            }
        });
    </script>
</body>
</html>
